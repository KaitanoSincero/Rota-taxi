<!DOCTYPE html>
<html lang="pt-AO"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com wss://*.firebaseio.com https://router.project-osrm.org https://nominatim.openstreetmap.org; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#1550b8">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Rota Táxi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f9;--sf:#fff;--tx:#0f1b33;--mu:#5b6678;--br:#d8dee9;--pri:#1550b8;--on:#fff;--ac:#ffc21a;--ok:#12805c;--wa:#b86e00;--er:#c0302b;--map:#e6ecf4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1424;--sf:#16213a;--tx:#eef2fa;--mu:#9aa7bd;--br:#2a3856;--pri:#6ea0ff;--on:#0c1424;--ok:#4cd6a0;--wa:#ffb84d;--er:#ff7a73;--map:#1b2943}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--pri);display:grid;place-items:center}
h1{font-size:1.15rem;margin:0;flex:1}h2{font-size:1.05rem;margin:0 0 8px}
.demo{display:none;margin:0 16px 10px;padding:8px 12px;border-radius:10px;background:var(--ac);color:#2a2000;font-size:.85rem;font-weight:600}
.btn,.chip{min-height:44px;border:1px solid var(--br);background:var(--sf);color:var(--tx);border-radius:12px;font:inherit;font-weight:600;padding:0 14px;cursor:pointer}
.chip[aria-pressed=true],.btn.p{background:var(--pri);color:var(--on);border-color:var(--pri)}
main{padding:0 16px 24px}.card{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.mu{color:var(--mu);font-size:.88rem}
svg.map{width:100%;height:auto;background:var(--map);border-radius:14px;display:block}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;border:2px solid}
.g{color:var(--ok)}.y{color:var(--wa)}.r{color:var(--er)}.u{color:var(--mu)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;min-height:56px;border:1px solid var(--br);background:var(--sf);color:var(--tx);border-radius:12px;padding:8px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--br)}
.wrap{overflow-x:auto}.btn:disabled{opacity:.5}
.start{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.big{min-height:96px;border-radius:18px;border:0;font:inherit;font-size:1.4rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.big small{font-size:.9rem;font-weight:500;opacity:.85}
.pas{background:var(--pri);color:var(--on)}.mot{background:var(--ac);color:#2a2000}
.drv{font-size:1.08rem}.drv .topbar{height:6px;background:var(--ac);margin:0 16px 10px;border-radius:99px}
.a{background:var(--sf);border:1px solid var(--br);border-radius:16px 16px 16px 4px;padding:12px;margin:0 20% 10px 0}
.u2{background:var(--ac);color:#2a2000;border-radius:16px 16px 4px 16px;padding:10px 12px;margin:0 0 10px 25%;font-weight:600}
.ans{display:flex;flex-direction:column;gap:8px;margin:12px 0}.ans .btn{min-height:60px;font-size:1.1rem;text-align:left}
.num{font-size:4.2rem;font-weight:800;line-height:1}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.ops .btn{min-height:68px;font-size:1.5rem;padding:0}
.up .btn{border-color:var(--ok);color:var(--ok)}.dn .btn{border-color:var(--er);color:var(--er)}
.sep{font-weight:700;margin:4px 0}

#mapbox{height:250px;margin:0 16px 10px;border-radius:14px;overflow:hidden;z-index:0}
input.f{width:100%;min-height:52px;font:inherit;font-size:1.05rem;margin:4px 0 10px;padding:0 12px;border-radius:12px;border:1px solid var(--br);background:var(--bg);color:var(--tx)}
.warn{margin:0 16px 10px;padding:8px 12px;border-radius:10px;background:var(--er);color:#fff;font-weight:600;font-size:.9rem}
.err{color:var(--er);font-weight:600;margin:6px 0}
</style></head><body>
<header><div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffc21a" stroke-width="2.4" stroke-linecap="round"><path d="M3 18c4-9 8-3 12-10l4 2"/><circle cx="19" cy="18" r="2" fill="#ffc21a"/></svg></div><h1>Rota Táxi</h1><span id="swap"></span></header>
<div id="top"></div><main id="app"></main>
<script type="module" src="app.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body></html>
